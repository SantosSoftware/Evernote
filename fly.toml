# fly.toml — Configuração do Parch no Fly.io
app = "parch"
primary_region = "gru"

[build]
  dockerfile = "Dockerfile"

[env]
  ASPNETCORE_ENVIRONMENT = "Production"
  DATABASE_PATH          = "/data/parch.db"
  UPLOADS_PATH           = "/data/uploads"

[[mounts]]
  source      = "parch_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https   = true
  auto_stop_machines  = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

  [http_service.concurrency]
    type       = "connections"
    hard_limit = 25
    soft_limit = 20

  [[http_service.checks]]
    grace_period = "30s"
    interval     = "10s"
    method       = "GET"
    path         = "/"
    timeout      = "5s"

[[vm]]
  memory   = "1gb"
  cpu_kind = "shared"
  cpus     = 1
